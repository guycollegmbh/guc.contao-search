services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Guc\SearchBundle\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/GucSearchBundle.php'

    Guc\SearchBundle\Repository\SearchRepository:
        public: true
        arguments:
            $projectDir: '%kernel.project_dir%'

    Guc\SearchBundle\Indexer\PageIndexer:
        tags: ['guc.search.indexer']

    Guc\SearchBundle\Indexer\FileIndexer:
        tags: ['guc.search.indexer']

    Guc\SearchBundle\Indexer\NewsIndexer:
        tags: ['guc.search.indexer']

    Guc\SearchBundle\Indexer\EventIndexer:
        tags: ['guc.search.indexer']

    Guc\SearchBundle\Indexer\MemberIndexer:
        tags: ['guc.search.indexer']

    Guc\SearchBundle\Indexer\FaqIndexer:
        tags: ['guc.search.indexer']

    # Public wrapper so SearchIndexModule can fetch indexers via System::getContainer()->get()
    Guc\SearchBundle\Indexer\IndexerRegistry:
        public: true
        arguments:
            $indexers: !tagged_iterator guc.search.indexer

    Guc\SearchBundle\Cron\RebuildSearchIndexCron:
        arguments:
            $indexers: !tagged_iterator guc.search.indexer

    Guc\SearchBundle\Command\BuildSearchIndexCommand:
        arguments:
            $indexers: !tagged_iterator guc.search.indexer
            $searchRepository: '@Guc\SearchBundle\Repository\SearchRepository'
        tags: ['console.command']

    Guc\SearchBundle\Controller\SearchApiController:
        public: true
        tags: ['controller.service_arguments']

    Guc\SearchBundle\Controller\FrontendModule\SearchModuleController:
        public: true
        tags: ['controller.service_arguments']

    Guc\SearchBundle\Backend\SearchIndexModule:
        public: true

